<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Ashwin Raghavendran</title>
  <desc id="desc">Animated comets cross a night sky. Software Development, Machine Learning and Financial Technology.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#080d17"/><stop offset="1" stop-color="#101e2b"/></linearGradient>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="-210" x2="0"><stop stop-color="#36e8d5" stop-opacity="0"/><stop offset=".45" stop-color="#36e8d5" stop-opacity=".08"/><stop offset=".85" stop-color="#36e8d5" stop-opacity=".5"/><stop offset="1" stop-color="#e0fffc"/></linearGradient>
    <linearGradient id="rose" gradientUnits="userSpaceOnUse" x1="-150" x2="0"><stop stop-color="#ff779e" stop-opacity="0"/><stop offset=".65" stop-color="#ff779e" stop-opacity=".18"/><stop offset="1" stop-color="#ffcbdc"/></linearGradient>
    <filter id="glow" x="-30%" y="-400%" width="160%" height="900%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="head-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
    <g id="comet">
      <path d="M-210 0 Q-90 -1 -9 -4 Q3 -3 3 0 Q3 3 -9 4 Q-90 1 -210 0" fill="url(#trail)" filter="url(#glow)"/>
      <path d="M-210 0 Q-80 -1 -3 -1.4 L0 0 L-3 1.4 Q-80 1 -210 0" fill="url(#trail)"/>
      <circle r="5" fill="#55eadb" opacity=".75" filter="url(#head-glow)"/>
      <circle r="2.2" fill="#f0fffc"/>
      <circle cx="-11" cy="1" r=".75" fill="#9df5e9" opacity=".65"/>
      <circle cx="-24" cy="-1" r=".55" fill="#9df5e9" opacity=".4"/>
    </g>
  </defs>
  <rect width="1000" height="280" rx="6" fill="url(#sky)"/>
  <g fill="#b8d4e5" opacity=".55">
    <circle cx="55" cy="42" r="1"/><circle cx="130" cy="165" r="1.3"/><circle cx="210" cy="65" r="1"/>
    <circle cx="290" cy="230" r="1"/><circle cx="395" cy="34" r="1.3"/><circle cx="480" cy="250" r="1"/>
    <circle cx="605" cy="41" r="1"/><circle cx="720" cy="210" r="1.5"/><circle cx="815" cy="62" r="1"/>
    <circle cx="960" cy="180" r="1.2"/><circle cx="900" cy="235" r="1"/><circle cx="70" cy="245" r="1"/>
    <animate attributeName="opacity" values=".35;.75;.35" dur="5s" repeatCount="indefinite"/>
  </g>
  <g opacity=".8">
    <use href="#comet">
      <animateMotion path="M-230 12 Q430 95 1260 28" dur="8s" repeatCount="indefinite" rotate="auto"/>
    </use>
    <use href="#comet">
      <animateMotion path="M-280 272 Q480 213 1280 270" dur="11s" begin="-5s" repeatCount="indefinite" rotate="auto"/>
    </use>
  </g>
  <g opacity=".55">
    <path d="M-150 0 Q-65 -1 -4 -2.5 L0 0 L-4 2.5 Q-65 1 -150 0" fill="url(#rose)"/>
    <circle r="4" fill="#ff96b9" filter="url(#head-glow)"/>
    <circle r="1.6" fill="#fff1f6"/>
    <animateMotion path="M1220 80 Q650 0 -220 78" dur="13s" begin="-8s" repeatCount="indefinite" rotate="auto"/>
  </g>
  <text x="500" y="126" text-anchor="middle" fill="#f0f6fc" font-family="Georgia,serif" font-size="43" font-weight="bold">Ashwin Raghavendran</text>
  <text x="500" y="165" text-anchor="middle" fill="#bdccd8" font-family="Arial,sans-serif" font-size="17">Software Development &#183; Machine Learning &#183; Financial Technology</text>
  <path d="M360 192 H640" stroke="#36e8d5" stroke-opacity=".6"/>
  <text x="500" y="224" text-anchor="middle" fill="#73e8d4" font-family="monospace" font-size="12">BUILD. EXPERIMENT. ITERATE.</text>
</svg>
